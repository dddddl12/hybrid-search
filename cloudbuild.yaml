steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', '${_AR_HOSTNAME}/$PROJECT_ID/hybrid-search/${_SERVICE_NAME}', '.' ]

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', '${_AR_HOSTNAME}/$PROJECT_ID/hybrid-search/${_SERVICE_NAME}' ]

  # Authenticate with GKE cluster
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'container', 'clusters', 'get-credentials', '${_CLUSTER_NAME}',
        '--region', '${_CLUSTER_REGION}',
        '--project', '$PROJECT_ID'
      ]

  # Apply Kubernetes manifests
  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      [
        'apply',
        '-f', 'kubernetes/deployment.yaml',
      ]
    env:
      - CLOUDSDK_COMPUTE_REGION=${_CLUSTER_REGION}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}

  # Optional: Rollout status check
#  - name: 'gcr.io/cloud-builders/kubectl'
#    args:
#      [
#        'rollout', 'status',
#        'deployment/${_SERVICE_NAME}',
#      ]

images:
  - '${_AR_HOSTNAME}/$PROJECT_ID/hybrid-search/${_SERVICE_NAME}'

#substitutions:
#  _AR_HOSTNAME: 'us-central1-docker.pkg.dev'
#  _SERVICE_NAME: 'my-service'
#  _CLUSTER_NAME: 'my-cluster'
#  _CLUSTER_REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
